name: MLOps-Lab5-Orchestration

on: [push, pull_request]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install apache-airflow pytest pandas scikit-learn mlflow dvc hydra-core optuna

      - name: DAG Integrity Test
        run: pytest tests/test_dag.py

      - name: Build Docker Image
        run: docker build -t ml-churn-project:latest .

      - name: Install Airflow & Test DAGs
        run: |
                pip install apache-airflow pytest
                pytest tests/test_dag.py 

      - name: Build Docker Image
        run: docker build -t ml-project:test .